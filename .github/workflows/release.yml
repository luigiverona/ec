name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Verify release tag
        run: |
          set -euo pipefail

          if ! printf '%s\n' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid version tag: $RELEASE_TAG" >&2
            exit 1
          fi

          if ! remote_line=$(git ls-remote --exit-code origin "refs/tags/$RELEASE_TAG"); then
            echo "Remote tag $RELEASE_TAG does not exist" >&2
            exit 1
          fi
          remote_object=$(printf '%s\n' "$remote_line" | awk 'NR == 1 { print $1 }')
          local_object=$(git rev-parse "$RELEASE_TAG")
          if [ -z "$remote_object" ] || [ "$remote_object" != "$local_object" ]; then
            echo "Remote tag $RELEASE_TAG is missing or differs from the checked-out tag" >&2
            exit 1
          fi

          checked_commit=$(git rev-parse HEAD)
          tag_commit=$(git rev-parse "$RELEASE_TAG^{}")
          if [ "$checked_commit" != "$tag_commit" ]; then
            echo "Checked-out commit does not match tag $RELEASE_TAG" >&2
            exit 1
          fi

          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          test "$RELEASE_TAG" = "v$version" || {
            echo "Tag $RELEASE_TAG does not match package version $version" >&2
            exit 1
          }
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --all-features

  build:
    needs: check
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            asset: ec-linux-x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: ec-linux-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install --yes musl-tools binutils file
      - run: cargo build --locked --release --target '${{ matrix.target }}'
      - name: Prepare binary
        run: |
          set -euo pipefail

          binary='target/${{ matrix.target }}/release/ec'
          asset='${{ matrix.asset }}'
          headers="$RUNNER_TEMP/program-headers"
          dynamic="$RUNNER_TEMP/dynamic-section"

          strip "$binary"
          file "$binary"
          readelf -h "$binary" >/dev/null
          readelf -l "$binary" > "$headers"

          if grep -q 'Requesting program interpreter' "$headers"; then
            echo "Binary has a dynamic program interpreter: $binary" >&2
            exit 1
          fi

          readelf -d "$binary" > "$dynamic" 2>/dev/null
          if grep -q '(NEEDED)' "$dynamic"; then
            echo "Binary has dynamic library dependencies: $binary" >&2
            exit 1
          fi

          "$binary" --help >/dev/null
          cp "$binary" "$asset"
          chmod 0755 "$asset"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ec-linux-*
          path: dist
          merge-multiple: true
      - name: Assemble release
        run: |
          set -euo pipefail

          test -f dist/ec-linux-x86_64
          test -f dist/ec-linux-aarch64
          chmod 0755 dist/ec-linux-x86_64 dist/ec-linux-aarch64
          cd dist
          sha256sum ec-linux-aarch64 ec-linux-x86_64 > SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 2
          sha256sum --check SHA256SUMS
      - name: Create and publish release
        run: |
          set -euo pipefail

          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists" >&2
            exit 1
          fi
          version=${RELEASE_TAG#v}
          notes="$RUNNER_TEMP/release-notes.md"
          cat > "$notes" <<'EOF'
          - One-time `ec setup` for device access and physical mouse selection
          - Narrow active-session udev access
          - Persistent physical mouse selection
          - Foreground readiness diagnostics
          - Configurable 1–600 CPS operation
          - Linux and Wayland support
          EOF
          gh release create "$RELEASE_TAG" \
            dist/ec-linux-x86_64 dist/ec-linux-aarch64 dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "EC $version" \
            --notes-file "$notes" --draft
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
